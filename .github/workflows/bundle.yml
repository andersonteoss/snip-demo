name: Build bundle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# No push trigger on purpose:
# this workflow file exists on main only, and GitHub evaluates push workflows
# from the pushed branch. backend/frontend/cli pushes would not run this file.

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and push bundle
        run: node scripts/build-bundle.mjs --push
